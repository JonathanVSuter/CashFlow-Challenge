services:
  postgres:
    image: postgres:16-alpine
    container_name: cashflow-postgres
    environment:
      POSTGRES_USER: cashflow
      POSTGRES_PASSWORD: cashflow
      POSTGRES_DB: cashflow
    ports:
      - "5432:5432"
    volumes:
      - cashflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashflow -d cashflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cashflow-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: cashflow
      RABBITMQ_DEFAULT_PASS: cashflow
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/CashFlow.Api/Dockerfile
    container_name: cashflow-api
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=cashflow;Username=cashflow;Password=cashflow
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: cashflow
      RabbitMq__Password: cashflow
      Jwt__Key: cash-flow-demo-secret-key-with-at-least-32-chars
      Jwt__Issuer: CashFlowChallenge
      Jwt__Audience: CashFlowChallenge
    ports:
      - "8080:8080"

  worker:
    build:
      context: .
      dockerfile: src/CashFlow.Worker/Dockerfile
    container_name: cashflow-worker
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DOTNET_ENVIRONMENT: Docker
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=cashflow;Username=cashflow;Password=cashflow
      RabbitMq__Host: rabbitmq
      RabbitMq__Username: cashflow
      RabbitMq__Password: cashflow

volumes:
  cashflow_postgres_data:
